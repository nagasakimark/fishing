<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gone Fishing! – What sea animal is this?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b3b5c;
    font-family: "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Varela Round", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 1366px; height: 598px; overflow: hidden; overflow: clip; transform-origin: center center; flex: none;
    background: linear-gradient(#6ccdf5 0, #c4eeff 170px, #2bb3d9 170px, #1a8fc0 340px, #0c5f92 598px); }
  .spr { position: absolute; pointer-events: none; display: block; }

  /* sky */
  #sun { z-index: 1; animation: sunspin 10s ease-in-out infinite alternate; }
  @keyframes sunspin { from { transform: rotate(-10deg) scale(.96); } to { transform: rotate(10deg) scale(1.04); } }
  .cloud { z-index: 1; opacity: .95; }
  .horizon { z-index: 1; filter: saturate(.7) brightness(1.05); opacity: .85; }
  #waves { position: absolute; left: 0; top: 156px; width: 2732px; height: 30px; z-index: 6; pointer-events: none;
    animation: waves 9s linear infinite; }
  @keyframes waves { to { transform: translateX(-683px); } }
  .rays { position: absolute; left: 0; top: 170px; width: 100%; height: 428px; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(105deg, rgba(255,255,255,.07) 0 40px, transparent 40px 120px);
    animation: rays 7s ease-in-out infinite alternate; }
  @keyframes rays { from { opacity: .6; } to { opacity: 1; } }

  /* sea floor */
  .sand { position: absolute; left: 0; bottom: 0; width: 100%; height: 46px; z-index: 2;
    background: linear-gradient(#f3d08a, #dcae62); border-radius: 50% 50% 0 0 / 18px 18px 0 0; }
  .far { z-index: 1; opacity: .35; filter: brightness(.7) saturate(.6); }
  .mid { z-index: 2; }
  .front { z-index: 5; }
  .sway { transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-6deg) skewX(-3deg); } to { transform: rotate(6deg) skewX(3deg); } }
  .pulse { transform-origin: 50% 100%; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08, .9); } }
  .wiggle { animation: wig 3s ease-in-out infinite; }
  @keyframes wig { 0%,70%,100% { transform: rotate(0); } 75% { transform: rotate(-14deg); } 80% { transform: rotate(12deg); } 85% { transform: rotate(-8deg); } 90% { transform: rotate(5deg); } }
  .groove { transform-origin: 50% 90%; animation: groove 1.2s ease-in-out infinite alternate; }
  @keyframes groove { from { transform: rotate(-10deg); } to { transform: rotate(10deg) translateY(-3px); } }
  .bob { animation: bob 3s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: rotate(-18deg); } to { transform: rotate(-10deg) translateY(-3px); } }
  .twinkle { z-index: 3; animation: twinkle 2s ease-in-out infinite; }
  @keyframes twinkle { 50% { filter: brightness(1.5) drop-shadow(0 0 8px #fff); transform: scale(1.15); } }
  .bubble { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; opacity: .85; }

  /* fisher */
  #rod { position: absolute; left: 0; top: 0; width: 1366px; height: 598px; z-index: 7; pointer-events: none; overflow: visible; }
  #fisher { position: absolute; left: 0; top: 0; width: 93px; height: 148px; z-index: 8; pointer-events: none; transform-origin: 47px 148px; }
  #fisher img { width: 100%; height: 100%; display: block; }
  #boat { position: absolute; left: 0; top: 0; width: 210px; height: 58px; z-index: 9; pointer-events: none; }
  #hook { position: absolute; left: 0; top: 0; width: 22px; height: 30px; z-index: 9; pointer-events: none; }

  /* animals */
  .animal { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; will-change: transform; }
  .animal img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 4px rgba(0,0,0,.18)); }
  .animal.hooked { z-index: 9; }

  /* HUD */
  #teams { position: absolute; left: 12px; top: 10px; z-index: 12; display: flex; gap: 8px; align-items: flex-start; }
  .chip { min-width: 54px; padding: 4px 10px 6px; border-radius: 16px; color: #fff; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.2);
    transition: transform .25s, box-shadow .25s; position: relative; }
  .chip .cname { font-size: 13px; font-weight: 900; opacity: .95; white-space: nowrap; }
  .chip .ccount { font-size: 30px; font-weight: 900; line-height: 1; }
  .chip.solo { background: rgba(255,255,255,.88); color: #1b5e8a; display: flex; align-items: center; gap: 6px; padding: 6px 16px 6px 10px; }
  .chip.solo svg { width: 42px; height: 42px; }
  .chip.solo .ccount { font-size: 34px; }
  .chip.active { transform: scale(1.18) translateY(3px); box-shadow: 0 0 0 4px #fff, 0 6px 14px rgba(0,0,0,.35); z-index: 2; }
  .chip.active::after { content: "▼"; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); color: #fff; font-size: 14px;
    text-shadow: 0 2px 2px rgba(0,0,0,.3); animation: arrow .8s ease-in-out infinite alternate; }
  @keyframes arrow { to { top: calc(100% + 5px); } }
  .chip.bump { animation: bump .45s; }
  @keyframes bump { 40% { filter: brightness(1.3); transform: scale(1.35); } }
  #finishBtn { position: absolute; right: 14px; top: 12px; z-index: 12; }
  #soundBtn { position: absolute; right: 148px; top: 12px; z-index: 12; padding: 10px 14px; }
  #dropBtn { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 12; font-size: 28px; padding: 12px 36px; white-space: nowrap; }
  #dropBtn:disabled { opacity: .45; cursor: default; filter: grayscale(.6); }
  .btn { font: inherit; font-weight: 900; border: none; border-radius: 999px; cursor: pointer; color: #fff;
    padding: 10px 24px; font-size: 22px; box-shadow: 0 5px 0 rgba(0,0,0,.25); transition: transform .08s; }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #dropBtn.btn:active:not(:disabled) { transform: translate(-50%, 3px); }
  .orange { background: #ff8a1f; } .blue { background: #2f86de; } .green { background: #2fb84f; } .red { background: #e5484d; }
  .purple { background: #8a5cf5; } .gray { background: #6b7a89; }
  #toast { position: absolute; left: 50%; top: 250px; transform: translate(-50%, 0) scale(.6); z-index: 20; opacity: 0;
    font-size: 42px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #0b3b5c, 0 0 12px rgba(0,0,0,.4); transition: .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* overlays */
  .overlay { position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; background: rgba(5, 40, 70, .6); }
  .overlay.show { display: flex; }
  .card { background: #fffaf0; border-radius: 30px; box-shadow: 0 10px 0 rgba(0,0,0,.2); position: relative; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }

  #catchCard { width: 1180px; height: 520px; display: flex; align-items: center; padding: 20px 40px; gap: 30px; animation: pop .35s; border: 8px solid transparent; }
  #bigAnimalWrap { width: 520px; height: 460px; display: flex; align-items: center; justify-content: center; flex: none;
    background: radial-gradient(circle, #d9f4ff 0, #b5e6fb 60%, transparent 61%); }
  #bigAnimal { max-width: 470px; max-height: 420px; animation: wiggleBig 1.6s ease-in-out infinite; }
  @keyframes wiggleBig { 0%,100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-10px); } }
  #catchRight { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  #catchTeam { font-size: 26px; font-weight: 900; color: #fff; padding: 6px 22px; border-radius: 999px; }
  #question { font-size: 48px; font-weight: 900; color: #1b5e8a; text-align: center; line-height: 1.15; }
  #mystery { width: 470px; height: 150px; border-radius: 24px; cursor: pointer; position: relative; perspective: 800px; }
  #mysteryFront, #mysteryBack { position: absolute; inset: 0; border-radius: 24px; display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; transition: transform .6s; flex-direction: column; }
  #mysteryFront { background: repeating-linear-gradient(45deg, #ffcc33 0 22px, #ffbb00 22px 44px); border: 6px solid #e09200;
    font-size: 110px; color: #fff; text-shadow: 0 5px 0 #c77700; animation: shake 2.2s infinite; }
  @keyframes shake { 0%,80%,100% { transform: rotate(0); } 84% { transform: rotate(-3deg); } 88% { transform: rotate(3deg); } 92% { transform: rotate(-2deg); } }
  #mysteryBack { background: #fff; border: 6px solid #2f86de; transform: rotateY(180deg); }
  #answerWord { font-size: 84px; font-weight: 900; color: #2f86de; line-height: 1; }
  #answerJa { font-size: 26px; color: #6b7a89; margin-top: 6px; }
  #mystery.open #mysteryFront { transform: rotateY(-180deg); animation: none; }
  #mystery.open #mysteryBack { transform: rotateY(0); }
  #catchButtons { display: flex; gap: 20px; height: 70px; align-items: center; }
  #catchButtons .btn { font-size: 30px; padding: 14px 34px; }
  .hidden { display: none !important; }

  #endCard { width: 1240px; height: 560px; padding: 20px 30px; display: flex; flex-direction: column; align-items: center; animation: pop .35s; }
  #endTitle { font-size: 44px; font-weight: 900; color: #1b5e8a; height: 56px; }
  #endGrid { flex: 1; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 14px 18px; min-height: 0; }
  .tally { width: 200px; height: 150px; background: #e7f6ff; border-radius: 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; opacity: 0; transform: scale(.5); transition: .3s; }
  .tally.show { opacity: 1; transform: scale(1); }
  .tally img { max-width: 120px; max-height: 80px; }
  .tally .tname { font-size: 20px; color: #1b5e8a; font-weight: 900; }
  .tally .tnum { font-size: 30px; color: #ff8a1f; font-weight: 900; }
  .tcol { flex: 1; max-width: 230px; height: 340px; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden;
    background: #eef6fb; border: 5px solid; transition: transform .4s, box-shadow .4s; position: relative; }
  .tcol .thead { color: #fff; font-size: 24px; font-weight: 900; text-align: center; padding: 6px 4px; }
  .tcol .ticons { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-end; justify-content: center; gap: 2px; padding: 6px; }
  .tcol .ticons img { object-fit: contain; animation: drop .3s; }
  @keyframes drop { from { transform: translateY(-40px) scale(1.5); opacity: 0; } }
  .tcol .tnum { font-size: 46px; font-weight: 900; text-align: center; padding-bottom: 4px; }
  .tcol.win { transform: scale(1.06); box-shadow: 0 0 0 6px #ffd84a, 0 0 30px 8px rgba(255,216,74,.8); overflow: visible; }
  #endTotal { font-size: 46px; font-weight: 900; color: #ff8a1f; height: 64px; text-shadow: 0 3px 0 #ffe0b8; text-align: center; }
  #endButtons { display: flex; gap: 20px; }
  .confetti { position: absolute; width: 12px; height: 18px; z-index: 40; pointer-events: none; }

  #startCard { width: 900px; padding: 30px 40px; text-align: center; animation: pop .35s; }
  #startCard h1 { font-size: 62px; color: #1b5e8a; }
  #startCard p { font-size: 23px; color: #4a5b6b; margin: 10px 0 22px; line-height: 1.4; }
  .modes { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .modes .btn { font-size: 26px; padding: 14px 28px; }
  .modes .big { font-size: 30px; padding: 16px 36px; }
  .rvb { background: linear-gradient(90deg, #e5484d 50%, #2f86de 50%); }
  .keys { font-size: 15px !important; color: #8a99a8 !important; margin: 18px 0 0 !important; }
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <div id="sky"></div>
  <div class="rays"></div>
  <svg id="waves" viewBox="0 0 2732 30" preserveAspectRatio="none"><path id="wavePath" fill="#2bb3d9" stroke="#fff" stroke-width="4" d=""/></svg>
  <div class="sand"></div>
  <div id="floor"></div>

  <svg id="rod"><path id="rodBody" fill="#b97a43" stroke="#1d0b06" stroke-width="1.8" stroke-linejoin="round"/>
    <path id="rodShine" fill="none" stroke="rgba(255,240,220,.7)" stroke-width="1.2" stroke-linecap="round"/>
    <g id="rodRings" fill="none" stroke="#555" stroke-width="1.6"></g>
    <line id="lineEl" stroke="#2a2a2a" stroke-width="1.6"/></svg>
  <div id="fisher"><img src="fisher.webp" alt=""></div>
  <svg id="boat" viewBox="0 0 210 58">
    <path d="M6 10 H204 L184 50 Q105 60 26 50 Z" fill="#a8652d" stroke="#3b1f0c" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M14 24 H196 M22 38 H188" stroke="#7a4519" stroke-width="2.5"/>
    <path d="M60 12 L56 50 M150 12 L154 50" stroke="#7a4519" stroke-width="2"/>
    <rect x="1" y="5" width="208" height="10" rx="5" fill="#d08b47" stroke="#3b1f0c" stroke-width="3"/>
    <circle cx="30" cy="31" r="7" fill="#fff" stroke="#3b1f0c" stroke-width="2.5"/><circle cx="30" cy="31" r="3" fill="#e5484d"/>
  </svg>
  <svg id="hook" viewBox="0 0 22 30"><circle cx="11" cy="4" r="3" fill="none" stroke="#555" stroke-width="2.5"/>
    <path d="M11 7 V22 a6 6 0 0 1 -9 -4 l3 -3" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/></svg>

  <div id="teams"></div>
  <button id="soundBtn" class="btn gray" title="Sound on/off">🔊</button>
  <button id="finishBtn" class="btn purple">Finish 🏁</button>
  <button id="dropBtn" class="btn orange">🎣 Drop the hook!</button>
  <div id="toast"></div>

  <div class="overlay show" id="startOverlay">
    <div class="card" id="startCard">
      <h1>🎣 Gone Fishing!</h1>
      <p>Drop the hook and catch a sea animal.<br>Can you say <b>what sea animal it is?</b></p>
      <div class="modes">
        <button class="btn orange big" data-teams="1">🪣 Whole class</button>
        <button class="btn rvb big" data-teams="2">Red vs Blue</button>
      </div>
      <div class="modes" style="margin-top:14px">
        <button class="btn green" data-teams="3">3 teams</button>
        <button class="btn purple" data-teams="4">4 teams</button>
        <button class="btn blue" data-teams="5">5 teams</button>
        <button class="btn red" data-teams="6">6 teams</button>
      </div>
      <p class="keys">Keys: Space = drop hook / reveal · C = correct · X = incorrect</p>
    </div>
  </div>

  <div class="overlay" id="catchOverlay">
    <div class="card" id="catchCard">
      <div id="bigAnimalWrap"><img id="bigAnimal" alt=""></div>
      <div id="catchRight">
        <div id="catchTeam" class="hidden"></div>
        <div id="question">What sea animal<br>is this??</div>
        <div id="mystery">
          <div id="mysteryFront">?</div>
          <div id="mysteryBack"><div id="answerWord"></div><div id="answerJa"></div></div>
        </div>
        <div id="catchButtons">
          <button class="btn blue" id="revealBtn">👀 Reveal</button>
          <button class="btn green hidden" id="correctBtn">⭕ Correct!</button>
          <button class="btn red hidden" id="wrongBtn">❌ Incorrect</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="endOverlay">
    <div class="card" id="endCard">
      <div id="endTitle"></div>
      <div id="endGrid"></div>
      <div id="endTotal"></div>
      <div id="endButtons">
        <button class="btn gray" id="backBtn">↩ Keep fishing</button>
        <button class="btn orange" id="againBtn">🔄 New game</button>
      </div>
    </div>
  </div>
</div>
</div>

<script>
// ================= data =================
// facing: 1 = picture faces right, -1 = faces left, 0 = faces the front (never flipped)
// weight: how much the rod bends when this animal is on the hook
const ANIMALS = {
  crab:      { ja: 'かに',     w: 125, facing: 0,  kind: 'crab',    weight: .35 },
  dolphin:   { ja: 'いるか',   w: 190, facing: 1,  kind: 'dolphin', weight: .75, speed: 100 },
  fish:      { ja: 'さかな',   w: 115, facing: -1, kind: 'fish',    weight: .3,  speed: 70 },
  jellyfish: { ja: 'くらげ',   w: 85,  facing: 0,  kind: 'jelly',   weight: .25 },
  octopus:   { ja: 'たこ',     w: 130, facing: 0,  kind: 'octopus', weight: .5 },
  penguin:   { ja: 'ペンギン', w: 72,  facing: -1, kind: 'penguin', weight: .45, speed: 125 },
  shark:     { ja: 'さめ',     w: 210, facing: -1, kind: 'shark',   weight: .85, speed: 85 },
  squid:     { ja: 'いか',     w: 165, facing: 1,  kind: 'squid',   weight: .5,  speed: 55 },
  turtle:    { ja: 'かめ',     w: 160, facing: 1,  kind: 'turtle',  weight: .6,  speed: 42 },
  whale:     { ja: 'くじら',   w: 255, facing: -1, kind: 'whale',   weight: 1,   speed: 36 },
};
const NAMES = Object.keys(ANIMALS);
const SIZES = { crab:[700,571], dolphin:[700,373], fish:[700,582], jellyfish:[445,700], octopus:[687,700],
  penguin:[427,700], shark:[700,393], squid:[700,479], turtle:[700,479], whale:[700,452] };
const TEAM_DEFS = [
  { name: 'Red', color: '#e5484d', emoji: '🔴' }, { name: 'Blue', color: '#2f86de', emoji: '🔵' },
  { name: 'Green', color: '#2fb84f', emoji: '🟢' }, { name: 'Yellow', color: '#f0b400', emoji: '🟡' },
  { name: 'Purple', color: '#8a5cf5', emoji: '🟣' }, { name: 'Orange', color: '#ff8a1f', emoji: '🟠' },
];
const article = n => /^[aeiou]/.test(n) ? 'an' : 'a';

const W = 1366, H = 598, SURFACE = 170, FLOOR = 560;
const $ = id => document.getElementById(id);
const stage = $('stage');
stage.addEventListener('scroll', () => { stage.scrollLeft = 0; stage.scrollTop = 0; });
NAMES.forEach(n => { const i = new Image(); i.src = `animals/${n}.webp`; });

function fit() { stage.style.transform = `scale(${Math.min(innerWidth / W, innerHeight / H)})`; }
addEventListener('resize', fit); fit();

// ================= scenery =================
function spr(parent, name, x, y, w, cls = '', extra = {}) {
  const i = document.createElement('img');
  i.src = `sprites/${name}.webp`; i.className = 'spr ' + cls;
  i.style.left = x + 'px'; i.style.width = w + 'px';
  if (extra.bottom != null) i.style.bottom = extra.bottom + 'px'; else i.style.top = y + 'px';
  if (extra.delay != null) i.style.animationDelay = extra.delay + 's';
  if (extra.flip) i.style.scale = '-1 1';
  if (extra.z != null) i.style.zIndex = extra.z;
  parent.appendChild(i); return i;
}
const clouds = [];
(function scenery() {
  let d = 'M0 30 L0 14';
  for (let x = 0; x <= 2732; x += 683 / 12) d += ` Q${x + 683 / 48} 4 ${x + 683 / 24} 14 T${x + 683 / 12} 14`;
  $('wavePath').setAttribute('d', d + ' L2732 30 Z');

  const sky = $('sky');
  spr(sky, 'sun', 1052, 2, 104).id = 'sun';
  [['cloud2', 380, 4, 120, 7], ['cloud4', 720, 30, 75, 10], ['cloud1', 880, 2, 88, 8], ['cloud3', 160, 70, 100, 6]]
    .forEach(([n, x, y, w, s]) => clouds.push({ el: spr(sky, n, 0, y, w, 'cloud'), x, w, speed: s }));
  // far-away islands on the horizon (bottoms tucked under the waves)
  spr(sky, 'volcano', 40, SURFACE - 52, 85, 'horizon');
  spr(sky, 'island', 255, SURFACE - 88, 70, 'horizon');
  spr(sky, 'mountain', 1190, SURFACE - 58, 140, 'horizon');
  clouds.push({ el: spr(sky, 'paperboat', 0, SURFACE - 24, 44, 'horizon', { z: 2 }), x: 1300, w: 44, speed: 9, boat: true });

  const f = $('floor');
  // distant underwater hills
  spr(f, 'hill2', 40, 0, 340, 'far', { bottom: 38 });
  spr(f, 'hill1', 420, 0, 380, 'far', { bottom: 40 });
  spr(f, 'hill2', 800, 0, 320, 'far', { bottom: 38, flip: true });
  spr(f, 'hill1', 1080, 0, 320, 'far', { bottom: 40 });
  // sand dunes
  spr(f, 'sandmound', -30, 0, 230, 'mid', { bottom: 26 });
  spr(f, 'sandmound', 540, 0, 210, 'mid', { bottom: 24 });
  spr(f, 'sandmound', 1150, 0, 250, 'mid', { bottom: 26 });
  // middle layer
  spr(f, 'seaweed', 20, 0, 60, 'mid sway', { bottom: 38, delay: -3.5 });
  spr(f, 'rock', 120, 0, 130, 'mid', { bottom: 34 });
  spr(f, 'seaweed', 262, 0, 55, 'mid sway', { bottom: 38, delay: -1 });
  spr(f, 'coral_red', 310, 0, 120, 'mid sway', { bottom: 36, delay: -2.3 });
  spr(f, 'seaweed', 470, 0, 70, 'mid sway', { bottom: 38, delay: -.4 });
  spr(f, 'sponge1', 640, 0, 110, 'mid', { bottom: 34 });
  spr(f, 'coral_pink', 760, 0, 80, 'mid sway', { bottom: 38, delay: -3.1 });
  spr(f, 'clam', 860, 0, 85, 'mid', { bottom: 32 });
  spr(f, 'pearl', 889, 0, 28, 'twinkle', { bottom: 52 });
  spr(f, 'greenmound', 965, 0, 130, 'mid', { bottom: 32 });
  spr(f, 'coral_orange', 1085, 0, 65, 'mid sway', { bottom: 40, delay: -1.7 });
  spr(f, 'seaweed', 1135, 0, 60, 'mid sway', { bottom: 38, delay: -2.6 });
  spr(f, 'sponge2', 1215, 0, 100, 'mid', { bottom: 34 });
  spr(f, 'seaweed', 1310, 0, 55, 'mid sway', { bottom: 38, delay: -.9 });
  // little things in front
  spr(f, 'scallop', 92, 0, 30, 'front', { bottom: 10 });
  spr(f, 'starfish', 215, 0, 50, 'front wiggle', { bottom: 12, delay: -1 });
  spr(f, 'conch', 380, 0, 56, 'front', { bottom: 10 });
  spr(f, 'bottle', 445, 0, 66, 'front bob', { bottom: 8 });

const bubbles = [];
function spawnBubble(x, y, big) {
  const b = document.createElement('img'); b.className = 'bubble';
  b.src = `sprites/${Math.random() < .3 ? 'ring' : 'bubble'}.webp`;
  const r = big ? 14 + Math.random() * 12 : 7 + Math.random() * 10; b.style.width = r + 'px';

// bubbles come out of the clam, the anemones and the rock now and then
const VENTS = [[902, FLOOR - 30], [945, FLOOR - 10], [1284, FLOOR - 10], [180, FLOOR - 40]];

// ================= sound =================
let soundOn = true, actx = null;
function ac() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function tone(freq, dur, type = 'sine', vol = .2, slideTo = null, delay = 0) {
  if (!soundOn) return;

    const a = ac(), t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  cast: () => tone(1400, .25, 'sine', .08, 300),
  bite: () => { tone(300, .08, 'square', .12); tone(500, .1, 'square', .12, null, .09); tone(800, .15, 'square', .12, null, .19); },
  splash: (v = .2) => { tone(900, .3, 'triangle', v, 120); tone(400, .25, 'sine', v * .75, 90, .05); },
  reveal: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .18, null, i * .08)),
  correct: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .3, 'sine', .2, null, i * .1)),
  wrong: () => { tone(220, .25, 'sawtooth', .12); tone(180, .35, 'sawtooth', .12, null, .2); },
  tick: () => tone(1200, .06, 'square', .08),
  plop: () => tone(600, .15, 'sine', .25, 150),
  turn: () => { tone(660, .12, 'triangle', .15); tone(880, .18, 'triangle', .15, null, .12); },
  nothing: () => { tone(400, .2, 'triangle', .15, 250); tone(250, .3, 'triangle', .15, 180, .2); },
  fanfare: () => [523, 523, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, i === 6 ? .6 : .18, 'square', .1, null, [0, .15, .3, .45, .7, .9, 1.05][i])),
};
function say(text) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = .85;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('en')); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
$('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; };

// ================= sea animals =================
let sea = [];
const laneY = h => Math.max(SURFACE + 45 + h / 2, Math.min(FLOOR - 40 - h / 2, 220 + Math.random() * 290));
const floatY = () => 250 + Math.random() * 200;
function faceFlip(a) { return a.info.facing === 0 ? 1 : (a.dir === a.info.facing ? 1 : -1); }
function makeAnimal(name, opts = {}) {
  const info = ANIMALS[name], [iw, ih] = SIZES[name];
  const w = info.w, h = w * ih / iw;
  const el = document.createElement('div'); el.className = 'animal';
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.innerHTML = `<img src="animals/${name}.webp" alt="">`;
  stage.appendChild(el);
  const dir = Math.random() < .5 ? 1 : -1;
  const a = { name, info, el, w, h, dir, ph: Math.random() * 6.28, state: 'swim', t: 0, pause: 0, sx: 1, sy: 1, rot: 0 };
  a.speed = (info.speed || 30) * (.85 + Math.random() * .3);
  if (info.kind === 'crab') { a.speed = 40; a.baseY = FLOOR - h / 2 + 6; }
  else if (info.kind === 'jelly' || info.kind === 'octopus') { a.speed = 16 + Math.random() * 12; a.baseY = floatY(); }
  else a.baseY = laneY(h);
  a.flip = faceFlip(a);
  a.x = opts.x ?? (dir === 1 ? -w / 2 - Math.random() * 200 : W + w / 2 + Math.random() * 200);
  a.y = a.baseY;
  sea.push(a); return a;
}
function resetSea() {
  sea.forEach(a => a.el.remove()); sea = [];
  [...NAMES, 'fish', 'jellyfish'].forEach(n => makeAnimal(n, { x: 80 + Math.random() * (W - 160) }));
}
function respawnLater(name, ms = 1500) { setTimeout(() => { if (playing) makeAnimal(name); }, ms); }

function updateAnimal(a, dt) {
  a.t += dt; a.ph += dt;
  const k = a.info.kind, ph = a.ph;
  a.sx = 1; a.sy = 1; a.rot = 0;
  if (a.state === 'leap') {               // dolphin jumping out of the water
    a.vy += 700 * dt; a.x += a.vx * dt; a.y += a.vy * dt;
    if (!a.splashed && a.y < SURFACE) { a.splashed = true; splash(a.x, .08); }
    if (a.splashed && !a.splashed2 && a.vy > 0 && a.y > SURFACE) { a.splashed2 = true; splash(a.x, .1); }
    a.rot = Math.atan2(a.vy, a.vx) * 180 / Math.PI - (a.dir === 1 ? 0 : 180);
    if (a.vy > 0 && a.y >= a.baseY) { a.state = 'swim'; a.y = a.baseY; }
    return draw(a);
  }
  if (a.state === 'dive') {               // thrown back in
    a.y += (a.baseY - a.y) * Math.min(1, dt * 2.2);
    a.x += a.dir * a.speed * .5 * dt; a.rot = 20 * a.dir * Math.min(1, Math.abs(a.y - a.baseY) / 100);
    if (Math.abs(a.y - a.baseY) < 3) a.state = 'swim';
    a.flip += (faceFlip(a) - a.flip) * Math.min(1, dt * 8);
    return draw(a);
  }
  // smooth turn-around: the picture squashes through 0 so it looks like it turns
  const target = faceFlip(a);
  if (a.flip !== target) { const s = Math.sign(target - a.flip) * dt * 5; a.flip = Math.abs(target - a.flip) <= Math.abs(s) ? target : a.flip + s; }
  const turning = Math.abs(a.flip) < 1 ? .3 : 1;
  let spd = a.speed;
  switch (k) {
    case 'fish': {
      const dart = Math.max(0, Math.sin(ph * .9)) ** 6; spd *= 1 + dart * 2.5;
      a.y = a.baseY + Math.sin(ph * 1.7) * 12; a.rot = Math.sin(ph * 9) * (4 + dart * 6);
      a.sx = 1 + Math.sin(ph * 9) * .04; break;
    }
    case 'shark': a.y = a.baseY + Math.sin(ph * 1.1) * 14; a.rot = Math.sin(ph * 3.2) * 3; a.sx = 1 + Math.sin(ph * 3.2) * .03; break;
    case 'whale':
      a.y = a.baseY + Math.sin(ph * .8) * 14; a.rot = Math.sin(ph * .8) * 4; a.sy = 1 + Math.sin(ph * 1.6) * .03;
      if (Math.random() < dt * .25) for (let i = 0; i < 5; i++) setTimeout(() => spawnBubble(a.x + a.dir * a.w * .2, a.y - a.h * .35, true), i * 90);
      break;
    case 'dolphin':
      a.y = a.baseY + Math.sin(ph * 2) * 16; a.rot = Math.cos(ph * 2) * 10 * a.dir;
      if (a.x > 200 && a.x < W - 200 && Math.random() < dt * .09 && Math.abs(a.x - hook.x) > 150 && turning === 1) {
        a.state = 'leap'; a.vx = a.dir * 240; a.vy = -Math.sqrt(2 * 700 * (a.y - SURFACE + 90)); a.splashed = a.splashed2 = false;
      }
      break;
    case 'squid': {   // jet-propelled pulses
      const jet = Math.max(0, Math.sin(ph * 2.2)) ** 2; spd *= .3 + jet * 2.2;
      a.sx = 1 + jet * .14; a.sy = 1 - jet * .1; a.y = a.baseY + Math.sin(ph * .9) * 18; break;
    }
    case 'turtle': a.y = a.baseY + Math.sin(ph * 1.2) * 12; a.rot = Math.sin(ph * 1.4) * 7; break;
    case 'penguin': {
      a.y = a.baseY + Math.sin(ph * 2.6) * 22;
      a.rot = (62 + Math.cos(ph * 2.6) * 10) * a.dir + Math.sin(ph * 14) * 4;
      if (Math.random() < dt * .3) spawnBubble(a.x - a.dir * a.w, a.y);
      break;
    }
    case 'jelly': {   // pulse up, drift down
      const p = Math.sin(ph * 2.4); a.sy = 1 + p * .1; a.sx = 1 - p * .06;
      a.y = a.baseY + Math.sin(ph * .7) * 40 - Math.max(0, p) * 6; a.rot = Math.sin(ph * .7) * 6; break;
    }
    case 'octopus': {
      const p = Math.sin(ph * 1.8); a.sy = 1 + p * .07; a.sx = 1 - p * .05;
      a.y = a.baseY + Math.sin(ph * .9) * 28; a.rot = Math.sin(ph * 1.1) * 8; break;
    }
    case 'crab': {    // scuttle, then stop and wave
      if (a.pause > 0) { a.pause -= dt; spd = 0; a.rot = Math.sin(ph * 16) * 6; a.sy = 1 + Math.sin(ph * 16) * .03; a.y = a.baseY; }
      else { a.y = a.baseY - Math.abs(Math.sin(ph * 12)) * 4; a.rot = Math.sin(ph * 12) * 3; if (Math.random() < dt * .35) a.pause = .8 + Math.random() * 1.2; }
      break;
    }
  }
  a.x += a.dir * spd * turning * dt;
  // occasionally turn around in the middle of the sea
  if (a.x > 120 && a.x < W - 120 && Math.random() < dt * (k === 'crab' ? .04 : .03)) a.dir *= -1;
  // swam off the side: come back in somewhere new
  if ((a.dir === 1 && a.x > W + a.w) || (a.dir === -1 && a.x < -a.w)) {
    if (Math.random() < .5) { a.dir *= -1; a.flip = faceFlip(a); } else a.x = a.dir === 1 ? -a.w / 2 : W + a.w / 2;
    if (k !== 'crab') a.baseY = (k === 'jelly' || k === 'octopus') ? floatY() : laneY(a.h);
  }
  draw(a);
}
function draw(a, extraRot = 0) {
  a.el.style.transform = `translate(${a.x - a.w / 2}px, ${a.y - a.h / 2}px) rotate(${a.rot + extraRot}deg) scale(${a.flip * a.sx}, ${a.sy})`;
}
function splash(x, vol = .2) {
  for (let i = 0; i < 6; i++) spawnBubble(x + Math.random() * 50 - 25, SURFACE + 10 + Math.random() * 20);
  sfx.splash(vol);
}

// ================= boat, fisherman, rod =================
const boat = { x: 640, dir: 1, speed: 50, bob: 0 };
const BOAT_MIN = 430, BOAT_MAX = 880;
const ROD_ANGLE = -19.9, ROD_LEN = 122;
const HAND = { x: 91.5, y: 62.4 }, FEET = { x: 47, y: 148 };   // inside the 93x148 fisher picture
function spring(v, k = 140, c = 12) { return { v, t: v, vel: 0, k, c }; }
const F = { lean: spring(0), hop: spring(0, 160, 10), rodRot: spring(0, 160, 11), bend: spring(0, 90, 7) };
function stepSpring(s, dt) { s.vel += ((s.t - s.v) * s.k - s.vel * s.c) * dt; s.v += s.vel * dt; }
const hook = { state: 'idle', x: 0, y: 0, caught: null, wait: 0 };
let playing = false, time = 0, tip = { x: 0, y: 0 };

function updateBoat(dt) {
  boat.bob += dt * 2;
  if (hook.state === 'idle' && playing) {
    boat.x += boat.dir * boat.speed * dt;
    if (boat.x > BOAT_MAX) boat.dir = -1;
    if (boat.x < BOAT_MIN) boat.dir = 1;
  }
  const bobY = Math.sin(boat.bob) * 3, tilt = Math.sin(boat.bob * .8) * 2;
  $('boat').style.transform = `translate(${boat.x - 105}px, ${SURFACE - 34 + bobY}px) rotate(${tilt}deg)`;

  // what the fisherman is doing right now
  const hs = hook.state, w = hook.caught ? hook.caught.info.weight : 0;
  F.lean.t = tilt; F.rodRot.t = Math.sin(time * 1.5) * 2; F.bend.t = 0;
  if (hs === 'down') { F.rodRot.t = 7 + Math.sin(time * 5) * 1.5; F.bend.t = 5 + Math.sin(time * 7); }
  else if (hs === 'wait') { F.rodRot.t = 9 + Math.sin(time * 3) * 3; F.bend.t = 7; }
  else if (hs === 'up') {
    F.bend.t = 18 + w * 42 + Math.sin(time * 11) * (3 + w * 5);
    F.lean.t = tilt - 5 - w * 6 + Math.sin(time * 11) * 1.5; F.rodRot.t = -14 - w * 6;
  }
  else if (hs === 'upEmpty') { F.bend.t = 3; F.rodRot.t = -8; }
  else if (hs === 'landed') { F.bend.t = 4; F.rodRot.t = -6; }
  Object.values(F).forEach(s => stepSpring(s, dt));

  const fx = boat.x - 78, fy = SURFACE - 6 - 148 + bobY;
  $('fisher').style.transform = `translate(${fx}px, ${fy + F.hop.v}px) rotate(${F.lean.v}deg)`;
  // where the hand is after leaning around the feet
  const L = F.lean.v * Math.PI / 180, vx = HAND.x - FEET.x, vy = HAND.y - FEET.y;
  const B = { x: fx + FEET.x + vx * Math.cos(L) - vy * Math.sin(L), y: fy + F.hop.v + FEET.y + vx * Math.sin(L) + vy * Math.cos(L) };
  drawRod(B, ROD_ANGLE + F.lean.v + F.rodRot.v, F.bend.v);
}

function drawRod(B, angDeg, bendDeg) {
  const a0 = angDeg * Math.PI / 180, a1 = (angDeg + bendDeg) * Math.PI / 180;
  const len = ROD_LEN * (1 - Math.abs(bendDeg) / 380);
  const P1 = { x: B.x + Math.cos(a0) * ROD_LEN * .55, y: B.y + Math.sin(a0) * ROD_LEN * .55 };
  const P2 = { x: B.x + Math.cos(a1) * len, y: B.y + Math.sin(a1) * len };
  const pt = t => ({ x: (1 - t) ** 2 * B.x + 2 * (1 - t) * t * P1.x + t * t * P2.x, y: (1 - t) ** 2 * B.y + 2 * (1 - t) * t * P1.y + t * t * P2.y });
  const der = t => ({ x: 2 * (1 - t) * (P1.x - B.x) + 2 * t * (P2.x - P1.x), y: 2 * (1 - t) * (P1.y - B.y) + 2 * t * (P2.y - P1.y) });
  const norm = t => { const d = der(t), l = Math.hypot(d.x, d.y) || 1; let nx = -d.y / l, ny = d.x / l; if (ny > 0) { nx = -nx; ny = -ny; } return [nx, ny]; };
  const up = [], down = [], shine = [], N = 16;
  let rings = '';
  for (let i = 0; i <= N; i++) {
    const t = i / N, p = pt(t), [nx, ny] = norm(t), hw = 4.1 * (1 - t) + 1.5 * t;
    up.push(`${(p.x + nx * hw).toFixed(1)},${(p.y + ny * hw).toFixed(1)}`);
    down.push(`${(p.x - nx * hw).toFixed(1)},${(p.y - ny * hw).toFixed(1)}`);
    if (t > .05 && t < .95) shine.push(`${(p.x + nx * hw * .45).toFixed(1)},${(p.y + ny * hw * .45).toFixed(1)}`);
    if ([5, 9, 13, 16].includes(i)) rings += `<circle cx="${(p.x + nx * (hw + 2)).toFixed(1)}" cy="${(p.y + ny * (hw + 2)).toFixed(1)}" r="1.8"/>`;
  }
  $('rodBody').setAttribute('d', `M${up.join(' L')} L${down.reverse().join(' L')} Z`);
  $('rodShine').setAttribute('d', 'M' + shine.join(' L'));
  $('rodRings').innerHTML = rings;
  const e = pt(1), [nx, ny] = norm(1);
  tip = { x: e.x + nx * 3.5, y: e.y + ny * 3.5 };   // the line comes out of the end ring
}

function dropHook() {
  if (!playing || hook.state !== 'idle') return;
  hook.state = 'down'; hook.x = tip.x; hook.caught = null; hook.wait = 0;
  $('dropBtn').disabled = true;
  F.rodRot.vel -= 500; F.bend.vel -= 200;   // flick the rod
  sfx.cast();
}

function updateHook(dt) {
  const restY = tip.y + 42;
  if (hook.state === 'idle' || hook.state === 'landed') {
    hook.x = tip.x + Math.sin(time * 2) * 2; hook.y = restY;
  } else if (hook.state === 'down' || hook.state === 'wait') {
    if (hook.state === 'down') {
      const before = hook.y;
      hook.y += (hook.y < SURFACE ? 280 : 165) * dt;
      if (before < SURFACE && hook.y >= SURFACE) splash(hook.x, .15);
      if (hook.y > FLOOR - 30) { hook.y = FLOOR - 30; hook.state = 'wait'; }
    } else if ((hook.wait += dt) > 2.5) {
      hook.state = 'upEmpty'; sfx.nothing();
      toast(teams.length > 1 ? `Nothing! ${team().name} Team, try again!` : 'Oh no! Nothing… 🫧');
    }
    if (hook.y > SURFACE && Math.random() < dt * 3) spawnBubble(hook.x, hook.y);
    const hx = hook.x, hy = hook.y + 22;
    const hit = hook.state !== 'upEmpty' && sea.find(a => (a.state === 'swim' || a.state === 'dive') &&
      Math.abs(hx - a.x) < a.w * .45 + 12 && Math.abs(hy - a.y) < a.h * .42 + 8);
    if (hit) {
      hook.caught = hit; hit.state = 'hooked'; hit.el.classList.add('hooked');
      hook.state = 'up'; sfx.bite();
      F.bend.vel += 500 + hit.info.weight * 600; F.lean.vel -= 120;   // yank!
    }
  } else if (hook.state === 'up' || hook.state === 'upEmpty') {
    const before = hook.y;
    hook.y -= (hook.caught ? 300 - hook.caught.info.weight * 110 : 320) * dt;
    hook.x += (tip.x - hook.x) * Math.min(1, dt * 2.5);
    if (hook.caught) {
      const a = hook.caught; a.t += dt;
      a.x = hook.x + Math.sin(a.t * 16) * 5; a.y = hook.y + 22 + a.h * .35;
      a.rot = 0; a.sx = 1 + Math.sin(a.t * 20) * .05; a.sy = 1 - Math.sin(a.t * 20) * .05;
      draw(a, Math.sin(a.t * 14) * 14);
      if (before > SURFACE && hook.y <= SURFACE) splash(hook.x, .2);
    }
    if (Math.random() < dt * 9) tone(900 + Math.random() * 300, .03, 'square', .04);
    if (hook.y <= restY) {
      hook.y = restY;
      if (hook.caught) { hook.state = 'landed'; F.hop.vel -= 260; F.bend.vel -= 300; setTimeout(() => showCatch(hook.caught), 350); }
      else { hook.state = 'idle'; $('dropBtn').disabled = false; }
    }
  }
  const le = $('lineEl');
  le.setAttribute('x1', tip.x); le.setAttribute('y1', tip.y); le.setAttribute('x2', hook.x); le.setAttribute('y2', hook.y + 2);
  $('hook').style.transform = `translate(${hook.x - 11}px, ${hook.y}px)`;
}

// ================= teams =================
let teams = [], turn = 0;
const team = () => teams[turn];
function setupTeams(n) {
  teams = n === 1 ? [{ name: 'Class', color: '#2f86de', solo: true }] : TEAM_DEFS.slice(0, n).map(t => ({ ...t }));
  teams.forEach(t => { t.caught = []; });
  turn = 0;
  const box = $('teams'); box.innerHTML = '';
  teams.forEach(t => {
    const c = document.createElement('div');
    if (t.solo) {
      c.className = 'chip solo';
      c.innerHTML = `<svg viewBox="0 0 50 50"><path d="M8 16 H42 L37 46 H13 Z" fill="#2f86de"/><ellipse cx="25" cy="16" rx="17" ry="5" fill="#1b5e8a"/>
        <path d="M8 16 Q25 -6 42 16" fill="none" stroke="#6b7a89" stroke-width="3"/><path d="M12 28 H38" stroke="#fff" stroke-width="3" opacity=".6"/></svg><span class="ccount">0</span>`;
    } else {
      c.className = 'chip'; c.style.background = t.color;
      c.innerHTML = `<div class="cname">${t.name}</div><div class="ccount">0</div>`;
    }
    t.chip = c; box.appendChild(c);
  });
  showTurn(false);
}
function showTurn(announce = true) {
  teams.forEach((t, i) => t.chip.classList.toggle('active', i === turn && teams.length > 1));
  const b = $('dropBtn');
  if (teams.length > 1) {
    b.style.background = team().color; b.textContent = `🎣 ${team().name} Team: Drop!`;
    if (announce) { toast(`${team().emoji} ${team().name} Team's turn!`); sfx.turn(); }
  } else { b.style.background = ''; b.textContent = '🎣 Drop the hook!'; }
}
function nextTurn() { if (teams.length > 1 && playing) { turn = (turn + 1) % teams.length; showTurn(); } }

// ================= catch flow =================
let current = null;
function showCatch(a) {
  current = a;
  a.el.style.visibility = 'hidden';
  $('bigAnimal').src = `animals/${a.name}.webp`;
  $('mystery').classList.remove('open');
  $('answerWord').textContent = a.name;
  $('answerJa').textContent = ANIMALS[a.name].ja;
  $('revealBtn').classList.remove('hidden');
  $('correctBtn').classList.add('hidden'); $('wrongBtn').classList.add('hidden');
  const multi = teams.length > 1;
  $('catchTeam').classList.toggle('hidden', !multi);
  if (multi) { $('catchTeam').textContent = `${team().name} Team`; $('catchTeam').style.background = team().color; }
  $('catchCard').style.borderColor = multi ? team().color : 'transparent';
  $('catchOverlay').classList.add('show');
  $('catchCard').style.animation = 'none'; void $('catchCard').offsetWidth; $('catchCard').style.animation = '';
  sfx.splash();
}
function reveal() {
  if (!current || $('mystery').classList.contains('open')) return;
  $('mystery').classList.add('open');
  $('revealBtn').classList.add('hidden');
  $('correctBtn').classList.remove('hidden'); $('wrongBtn').classList.remove('hidden');
  sfx.reveal();
  const n = current.name;
  setTimeout(() => say(`It's ${article(n)} ${n}!`), 350);
}
$('mystery').onclick = reveal; $('revealBtn').onclick = reveal;

function judge(correct) {
  if (!current || !$('mystery').classList.contains('open')) return;
  const a = current, t = team(); current = null;
  $('catchOverlay').classList.remove('show');
  a.el.style.visibility = ''; a.el.classList.remove('hooked');
  if (correct) {
    sfx.correct(); F.hop.vel -= 420;
    setTimeout(() => { F.hop.vel -= 300; }, 450);
    t.caught.push(a.name);
    flyToBucket(a, t);
    sea = sea.filter(s => s !== a);
    respawnLater(a.name);
  } else {
    sfx.wrong(); F.lean.vel += 160; F.rodRot.vel += 300;
    toast('Back into the sea! 🌊');
    a.state = 'dive'; a.y = SURFACE + 10; a.dir = Math.random() < .5 ? 1 : -1; a.rot = 0;
    setTimeout(() => splash(a.x, .2), 150);
  }
  hook.caught = null; hook.state = 'idle'; $('dropBtn').disabled = false;
  setTimeout(nextTurn, correct ? 900 : 1300);
}
$('correctBtn').onclick = () => judge(true);
$('wrongBtn').onclick = () => judge(false);

function flyToBucket(a, t) {
  const el = a.el, sx = a.x - a.w / 2, sy = a.y - a.h / 2;
  const r = t.chip.getBoundingClientRect(), s = stage.getBoundingClientRect(), k = s.width / W;
  const tx = (r.left + r.width / 2 - s.left) / k - a.w / 2, ty = (r.top + r.height / 2 - s.top) / k - a.h / 2;
  let p = 0; el.style.zIndex = 25;
  const step = () => {
    p += 1 / 40; const e = p * p * (3 - 2 * p);
    el.style.transform = `translate(${sx + (tx - sx) * e}px, ${sy + (ty - sy) * e - Math.sin(e * Math.PI) * 150}px) scale(${1 - e * .85}) rotate(${e * 360}deg)`;
    if (p < 1) requestAnimationFrame(step);
    else {
      el.remove();
      t.chip.querySelector('.ccount').textContent = t.caught.length;
      t.chip.classList.remove('bump'); void t.chip.offsetWidth; t.chip.classList.add('bump');
    }
  };
  step();
}

let toastTimer;
function toast(msg) {
  $('toast').textContent = msg; $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1700);
}

// ================= end of game =================
let endTimers = [];
const later = (fn, ms) => endTimers.push(setTimeout(fn, ms));
function finish() {
  if (!playing || current) return;
  if (hook.state !== 'idle') { toast('Wait for the hook! 🎣'); return; }
  playing = false;
  endTimers.forEach(clearTimeout); endTimers = [];
  $('endGrid').innerHTML = ''; $('endTotal').textContent = '';
  $('endOverlay').classList.add('show');
  $('endCard').style.animation = 'none'; void $('endCard').offsetWidth; $('endCard').style.animation = '';
  teams.length > 1 ? finishTeams() : finishSolo();
}
function finishSolo() {
  const caught = teams[0].caught, grid = $('endGrid');
  $('endTitle').textContent = "🪣 Let's count the bucket!";
  const counts = {}; caught.forEach(n => counts[n] = (counts[n] || 0) + 1);
  const order = NAMES.filter(n => counts[n]).sort((x, y) => counts[y] - counts[x]);
  if (!order.length) { grid.innerHTML = '<div style="font-size:36px;color:#6b7a89;text-align:center">The bucket is empty! 🪣<br>Let\'s go fishing!</div>'; return; }
  const cards = order.map(n => {
    const d = document.createElement('div'); d.className = 'tally';
    d.innerHTML = `<img src="animals/${n}.webp" alt=""><div class="tname">${n}</div><div class="tnum">× 0</div>`;
    grid.appendChild(d); return d;
  });
  let running = 0, delay = 500;
  order.forEach((n, i) => {
    later(() => { cards[i].classList.add('show'); sfx.plop(); }, delay); delay += 300;
    for (let k = 1; k <= counts[n]; k++) {
      later(() => { cards[i].querySelector('.tnum').textContent = '× ' + k; $('endTotal').textContent = ++running; sfx.tick(); }, delay);
      delay += 180;
    }
    delay += 150;
  });
  later(() => {
    const total = caught.length;
    $('endTotal').textContent = `We caught ${total} sea animal${total === 1 ? '' : 's'}! 🎉`;
    sfx.fanfare(); confetti();
    setTimeout(() => say(`We caught ${total} sea animal${total === 1 ? '' : 's'}! Great job!`), 600);
  }, delay + 200);
}
function finishTeams() {
  $('endTitle').textContent = "🪣 Let's count the buckets!";
  const grid = $('endGrid'), max = Math.max(0, ...teams.map(t => t.caught.length));
  const size = max <= 8 ? 54 : max <= 16 ? 42 : max <= 30 ? 32 : 24;
  const cols = teams.map(t => {
    const c = document.createElement('div'); c.className = 'tcol'; c.style.borderColor = t.color;
    c.innerHTML = `<div class="thead" style="background:${t.color}">${t.name}</div><div class="ticons"></div><div class="tnum" style="color:${t.color}">0</div>`;
    grid.appendChild(c); return c;
  });
  let delay = 700;
  for (let k = 1; k <= max; k++) {   // all the teams count up together, one animal at a time
    later(() => {
      teams.forEach((t, i) => {
        if (t.caught.length < k) return;
        const img = document.createElement('img'); img.src = `animals/${t.caught[k - 1]}.webp`;
        img.style.width = img.style.height = size + 'px';
        cols[i].querySelector('.ticons').appendChild(img);
        cols[i].querySelector('.tnum').textContent = k;
      });
      sfx.tick();
    }, delay);
    delay += max > 20 ? 160 : 320;
  }
  later(() => {
    const winners = teams.filter(t => t.caught.length === max);
    let msg;
    if (max === 0) msg = 'No sea animals yet! 🫧';
    else if (winners.length === teams.length) msg = "It's a tie! Everyone wins! 🎉";
    else if (winners.length > 2) msg = `It's a ${winners.length}-way tie! 🎉`;
    else if (winners.length > 1) msg = `It's a tie! ${winners.map(w => w.name).join(' & ')} 🎉`;
    else msg = `🏆 ${winners[0].name} Team wins! 🏆`;
    $('endTotal').textContent = msg;
    if (max > 0) {
      winners.forEach(w => { const c = cols[teams.indexOf(w)]; c.classList.add('win'); c.querySelector('.thead').textContent = `👑 ${w.name} 👑`; });
      sfx.fanfare(); confetti();
      setTimeout(() => say(winners.length === 1 ? `${winners[0].name} team wins!` : "It's a tie!"), 700);
    }
  }, delay + 400);
}
function confetti() {
  const cols = ['#ff8a1f', '#2f86de', '#2fb84f', '#e5484d', '#ffcc33', '#8a5cf5'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.background = cols[i % cols.length]; c.style.left = Math.random() * W + 'px'; c.style.top = '-20px';
    stage.appendChild(c);
    const vy = 150 + Math.random() * 250, vx = (Math.random() - .5) * 120, spin = Math.random() * 720;
    let t = 0;
    const f = () => { t += 1 / 60; c.style.transform = `translate(${vx * t}px, ${vy * t}px) rotate(${spin * t}deg)`;
      if (t < 4) requestAnimationFrame(f); else c.remove(); };
    setTimeout(f, Math.random() * 600);
  }
}
$('finishBtn').onclick = finish;
$('backBtn').onclick = () => { endTimers.forEach(clearTimeout); $('endOverlay').classList.remove('show'); playing = true; };
$('againBtn').onclick = () => { endTimers.forEach(clearTimeout); $('endOverlay').classList.remove('show'); $('startOverlay').classList.add('show'); };

function newGame(n) {
  setupTeams(n);
  hook.state = 'idle'; hook.caught = null; current = null;
  $('dropBtn').disabled = false;
  resetSea();
  playing = true;
  if (n > 1) setTimeout(() => showTurn(), 300);
}
document.querySelectorAll('[data-teams]').forEach(b => b.onclick = () => {
  ac(); $('startOverlay').classList.remove('show'); newGame(+b.dataset.teams);
});
$('dropBtn').onclick = dropHook;

addEventListener('keydown', e => {
  if (e.repeat || $('startOverlay').classList.contains('show')) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); if (current) reveal(); else dropHook(); }
  else if (k === 'enter') { e.preventDefault(); reveal(); }
  else if (k === 'c' || k === 'o') judge(true);
  else if (k === 'x') judge(false);
});

// ================= main loop =================
setupTeams(1); resetSea();
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  updateBoat(dt);
  sea.forEach(a => { if (a.state !== 'hooked') updateAnimal(a, dt); });
  updateHook(dt);
  clouds.forEach(c => {
    c.x -= c.speed * dt;
    if (c.x < -c.w - 20) c.x = W + 20;
    c.el.style.transform = c.boat ? `translate(${c.x}px, ${Math.sin(time * 2) * 2}px) rotate(${Math.sin(time * 1.6) * 5}deg)` : `translateX(${c.x}px)`;
  });
  if (Math.random() < dt * 1.5) { const v = VENTS[Math.floor(Math.random() * VENTS.length)]; spawnBubble(v[0] + Math.random() * 10, v[1]); }
  if (Math.random() < dt * .6) spawnBubble();
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.y -= (40 + b.r * 3) * dt; b.ph += dt * 3;
    b.el.style.transform = `translate(${b.x + Math.sin(b.ph) * 5}px, ${b.y}px)`;
    if (b.y < SURFACE + 2) { b.el.remove(); bubbles.splice(i, 1); }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
