<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gone Fishing! – What sea animal is this?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b3b5c;
    font-family: "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Varela Round", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 1366px; height: 598px; overflow: hidden; overflow: clip; transform-origin: center center; flex: none;
    background: linear-gradient(#7fd3f7 0, #c9f0ff 150px, #2bb3d9 150px, #1a8fc0 330px, #0f6a9e 598px); }

  /* --- scenery --- */
  .sun { position: absolute; left: 60px; top: 18px; width: 70px; height: 70px; border-radius: 50%;
    background: #ffe45c; box-shadow: 0 0 0 10px rgba(255,228,92,.35), 0 0 40px 18px rgba(255,228,92,.45); }
  .cloud { position: absolute; background: #fff; border-radius: 40px; opacity: .95; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 50%; height: 140%; left: 15%; top: -60%; }
  .cloud::after { width: 38%; height: 110%; left: 50%; top: -40%; }
  #waves { position: absolute; left: 0; top: 136px; width: 2732px; height: 30px; z-index: 6; pointer-events: none;
    animation: waves 9s linear infinite; }
  @keyframes waves { to { transform: translateX(-683px); } }
  .rays { position: absolute; left: 0; top: 150px; width: 100%; height: 448px; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(105deg, rgba(255,255,255,.07) 0 40px, transparent 40px 120px); }
  .sand { position: absolute; left: 0; bottom: 0; width: 100%; height: 50px; z-index: 1;
    background: radial-gradient(ellipse at 20% 0, #f5dc9c 0 40%, transparent 41%) , linear-gradient(#e9c97a, #d4ad5c);
    border-radius: 50% 50% 0 0 / 22px 22px 0 0; }
  .weed { position: absolute; bottom: 20px; z-index: 2; transform-origin: bottom center; animation: sway 4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .bubble { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); background: rgba(255,255,255,.15);
    z-index: 3; pointer-events: none; }

  /* --- boat & line --- */
  #boat { position: absolute; top: 46px; width: 200px; height: 120px; z-index: 7; pointer-events: none; }
  #line { position: absolute; left: 0; top: 0; width: 1366px; height: 598px; z-index: 8; pointer-events: none; }
  #hook { position: absolute; width: 22px; height: 30px; z-index: 9; pointer-events: none; }

  /* --- animals --- */
  .animal { position: absolute; z-index: 4; pointer-events: none; will-change: transform; }
  .animal img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 4px rgba(0,0,0,.18)); }
  .animal.hooked { z-index: 9; }

  /* --- HUD --- */
  #bucketBox { position: absolute; left: 150px; top: 12px; z-index: 12; display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.85); border-radius: 18px; padding: 6px 16px 6px 10px; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  #bucketBox svg { width: 46px; height: 46px; }
  #bucketCount { font-size: 34px; font-weight: 900; color: #1b5e8a; min-width: 30px; text-align: center; }
  #bucketBox.bump { animation: bump .45s; }
  @keyframes bump { 40% { transform: scale(1.25); } }
  #finishBtn { position: absolute; right: 14px; top: 12px; z-index: 12; }
  #dropBtn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 12; font-size: 30px; padding: 12px 40px; }
  #dropBtn:disabled { opacity: .45; cursor: default; filter: grayscale(.6); }
  .btn { font: inherit; font-weight: 900; border: none; border-radius: 999px; cursor: pointer; color: #fff;
    padding: 10px 24px; font-size: 22px; box-shadow: 0 5px 0 rgba(0,0,0,.25); transition: transform .08s; }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #dropBtn.btn:active:not(:disabled) { transform: translate(-50%, 3px); }
  .orange { background: #ff8a1f; } .blue { background: #2f86de; } .green { background: #2fb84f; } .red { background: #e5484d; }
  .purple { background: #8a5cf5; } .gray { background: #6b7a89; }
  #toast { position: absolute; left: 50%; top: 220px; transform: translate(-50%, 0) scale(.6); z-index: 20; opacity: 0;
    font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #0b3b5c, 0 0 12px rgba(0,0,0,.4); transition: .25s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #soundBtn { position: absolute; right: 150px; top: 12px; z-index: 12; padding: 10px 14px; }

  /* --- catch overlay --- */
  .overlay { position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
    background: rgba(5, 40, 70, .6); }
  .overlay.show { display: flex; }
  .card { background: #fffaf0; border-radius: 30px; box-shadow: 0 10px 0 rgba(0,0,0,.2); position: relative; }
  #catchCard { width: 1180px; height: 520px; display: flex; align-items: center; padding: 20px 40px; gap: 30px; animation: pop .35s; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }
  #bigAnimalWrap { width: 520px; height: 470px; display: flex; align-items: center; justify-content: center; flex: none;
    background: radial-gradient(circle, #d9f4ff 0, #b5e6fb 60%, transparent 61%); }
  #bigAnimal { max-width: 470px; max-height: 430px; animation: wiggle 1.6s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-10px); } }
  #catchRight { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  #question { font-size: 48px; font-weight: 900; color: #1b5e8a; text-align: center; line-height: 1.15; }
  #mystery { width: 470px; height: 150px; border-radius: 24px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; perspective: 800px; }
  #mysteryFront, #mysteryBack { position: absolute; inset: 0; border-radius: 24px; display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; transition: transform .6s; flex-direction: column; }
  #mysteryFront { background: repeating-linear-gradient(45deg, #ffcc33 0 22px, #ffbb00 22px 44px); border: 6px solid #e09200;
    font-size: 110px; color: #fff; text-shadow: 0 5px 0 #c77700; animation: shake 2.2s infinite; }
  @keyframes shake { 0%,80%,100% { transform: rotate(0); } 84% { transform: rotate(-3deg); } 88% { transform: rotate(3deg); } 92% { transform: rotate(-2deg); } }
  #mysteryBack { background: #fff; border: 6px solid #2f86de; transform: rotateY(180deg); }
  #answerWord { font-size: 84px; font-weight: 900; color: #2f86de; line-height: 1; }
  #answerJa { font-size: 26px; color: #6b7a89; margin-top: 6px; }
  #mystery.open #mysteryFront { transform: rotateY(-180deg); animation: none; }
  #mystery.open #mysteryBack { transform: rotateY(0); }
  #catchButtons { display: flex; gap: 20px; height: 70px; align-items: center; }
  #catchButtons .btn { font-size: 30px; padding: 14px 34px; }
  .hidden { display: none !important; }

  /* --- end screen --- */
  #endCard { width: 1200px; height: 540px; padding: 24px 40px; display: flex; flex-direction: column; align-items: center; animation: pop .35s; }
  #endTitle { font-size: 46px; font-weight: 900; color: #1b5e8a; }
  #endGrid { flex: 1; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 14px 18px; }
  .tally { width: 200px; height: 150px; background: #e7f6ff; border-radius: 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; opacity: 0; transform: scale(.5); transition: .3s; }
  .tally.show { opacity: 1; transform: scale(1); }
  .tally img { max-width: 120px; max-height: 80px; }
  .tally .tname { font-size: 20px; color: #1b5e8a; font-weight: 900; }
  .tally .tnum { font-size: 30px; color: #ff8a1f; font-weight: 900; }
  .tally.zero { filter: grayscale(1); opacity: .45 !important; }
  #endTotal { font-size: 52px; font-weight: 900; color: #ff8a1f; height: 70px; text-shadow: 0 3px 0 #ffe0b8; }
  #endButtons { display: flex; gap: 20px; margin-top: 8px; }
  .confetti { position: absolute; width: 12px; height: 18px; z-index: 40; pointer-events: none; }

  /* --- start screen --- */
  #startCard { width: 760px; padding: 36px 40px; text-align: center; animation: pop .35s; }
  #startCard h1 { font-size: 64px; color: #1b5e8a; }
  #startCard p { font-size: 24px; color: #4a5b6b; margin: 14px 0 26px; line-height: 1.4; }
  #startCard .btn { font-size: 34px; padding: 14px 50px; }
  .keys { font-size: 16px !important; color: #8a99a8 !important; margin: 18px 0 0 !important; }
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <div class="sun"></div>
  <div class="cloud" style="left:330px;top:40px;width:120px;height:34px"></div>
  <div class="cloud" style="left:880px;top:26px;width:150px;height:40px"></div>
  <div class="cloud" style="left:1180px;top:70px;width:90px;height:26px"></div>
  <div class="rays"></div>
  <svg id="waves" viewBox="0 0 2732 30" preserveAspectRatio="none">
    <path id="wavePath" fill="#2bb3d9" stroke="#fff" stroke-width="4" d=""/>
  </svg>
  <div class="sand"></div>
  <div id="decor"></div>

  <svg id="line"><line id="lineEl" x1="0" y1="0" x2="0" y2="0" stroke="#333" stroke-width="2"/></svg>
  <svg id="hook" viewBox="0 0 22 30"><circle cx="11" cy="4" r="3" fill="none" stroke="#555" stroke-width="2.5"/>
    <path d="M11 7 V22 a6 6 0 0 1 -9 -4 l3 -3" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/></svg>

  <!-- original boat + fisher cat -->
  <svg id="boat" viewBox="0 0 200 120">
    <g id="rod"><line x1="120" y1="62" x2="186" y2="8" stroke="#7a4a1e" stroke-width="5" stroke-linecap="round"/>
      <circle cx="128" cy="58" r="6" fill="#999"/></g>
    <!-- cat body -->
    <ellipse cx="100" cy="72" rx="26" ry="22" fill="#ffb347"/>
    <circle cx="100" cy="40" r="24" fill="#ffb347"/>
    <path d="M80 26 L78 6 L94 20 Z M120 26 L122 6 L106 20 Z" fill="#ffb347"/>
    <path d="M82 22 L81 12 L89 19 Z M118 22 L119 12 L111 19 Z" fill="#ff8fa3"/>
    <circle cx="91" cy="38" r="4" fill="#222"/><circle cx="109" cy="38" r="4" fill="#222"/>
    <circle cx="92.5" cy="36.5" r="1.4" fill="#fff"/><circle cx="110.5" cy="36.5" r="1.4" fill="#fff"/>
    <path d="M97 46 L100 49 L103 46 Z" fill="#ff6f8a"/>
    <path d="M94 51 Q100 56 106 51" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M80 46 L66 44 M80 49 L67 51 M120 46 L134 44 M120 49 L133 51" stroke="#222" stroke-width="1.5"/>
    <!-- hat -->
    <path d="M70 22 Q100 2 130 22 Z" fill="#2f86de"/><rect x="66" y="20" width="68" height="6" rx="3" fill="#1b5e8a"/>
    <!-- paw on rod -->
    <circle cx="122" cy="64" r="7" fill="#ffb347" stroke="#e58f1f" stroke-width="2"/>
    <!-- boat -->
    <path d="M10 82 H190 L170 116 H32 Z" fill="#e5484d"/>
    <path d="M10 82 H190 L186 90 H14 Z" fill="#fff"/>
    <circle cx="60" cy="100" r="6" fill="#fff"/><circle cx="140" cy="100" r="6" fill="#fff"/>
  </svg>

  <div id="bucketBox">
    <svg viewBox="0 0 50 50"><path d="M8 16 H42 L37 46 H13 Z" fill="#2f86de"/><ellipse cx="25" cy="16" rx="17" ry="5" fill="#1b5e8a"/>
      <path d="M8 16 Q25 -6 42 16" fill="none" stroke="#6b7a89" stroke-width="3"/><path d="M12 28 H38" stroke="#fff" stroke-width="3" opacity=".6"/></svg>
    <span id="bucketCount">0</span>
  </div>
  <button id="soundBtn" class="btn gray" title="Sound on/off">🔊</button>
  <button id="finishBtn" class="btn purple">Finish 🏁</button>
  <button id="dropBtn" class="btn orange">🎣 Drop the hook!</button>
  <div id="toast"></div>

  <!-- start -->
  <div class="overlay show" id="startOverlay">
    <div class="card" id="startCard">
      <h1>🎣 Gone Fishing!</h1>
      <p>Drop the hook and catch a sea animal.<br>Can you say <b>what sea animal it is?</b></p>
      <button class="btn orange" id="startBtn">Let's fish!</button>
      <p class="keys">Keys: Space = drop hook · Enter = reveal · C = correct · X = incorrect</p>
    </div>
  </div>

  <!-- catch -->
  <div class="overlay" id="catchOverlay">
    <div class="card" id="catchCard">
      <div id="bigAnimalWrap"><img id="bigAnimal" alt=""></div>
      <div id="catchRight">
        <div id="question">What sea animal<br>is this??</div>
        <div id="mystery">
          <div id="mysteryFront">?</div>
          <div id="mysteryBack"><div id="answerWord"></div><div id="answerJa"></div></div>
        </div>
        <div id="catchButtons">
          <button class="btn blue" id="revealBtn">👀 Reveal</button>
          <button class="btn green hidden" id="correctBtn">⭕ Correct!</button>
          <button class="btn red hidden" id="wrongBtn">❌ Incorrect</button>
        </div>
      </div>
    </div>
  </div>

  <!-- end -->
  <div class="overlay" id="endOverlay">
    <div class="card" id="endCard">
      <div id="endTitle">🪣 Let's count your bucket!</div>
      <div id="endGrid"></div>
      <div id="endTotal"></div>
      <div id="endButtons">
        <button class="btn gray" id="backBtn">↩ Keep fishing</button>
        <button class="btn orange" id="againBtn">🔄 New game</button>
      </div>
    </div>
  </div>
</div>
</div>

<script>
// ---------- data ----------
// facing: 1 = image faces right, -1 = faces left, 0 = faces front (no flip)
const ANIMALS = {
  crab:      { ja: 'かに',     w: 130, facing: 0,  kind: 'walk' },
  dolphin:   { ja: 'いるか',   w: 190, facing: 1,  kind: 'swim', speed: 95 },
  fish:      { ja: 'さかな',   w: 120, facing: -1, kind: 'swim', speed: 70 },
  jellyfish: { ja: 'くらげ',   w: 85,  facing: 0,  kind: 'float' },
  octopus:   { ja: 'たこ',     w: 135, facing: 0,  kind: 'float' },
  penguin:   { ja: 'ペンギン', w: 80,  facing: -1, kind: 'swim', speed: 110 },
  shark:     { ja: 'さめ',     w: 210, facing: -1, kind: 'swim', speed: 85 },
  squid:     { ja: 'いか',     w: 170, facing: 1,  kind: 'swim', speed: 60 },
  turtle:    { ja: 'かめ',     w: 165, facing: 1,  kind: 'swim', speed: 45 },
  whale:     { ja: 'くじら',   w: 260, facing: -1, kind: 'swim', speed: 40 },
};
const NAMES = Object.keys(ANIMALS);
const SIZES = { crab:[700,571], dolphin:[700,373], fish:[700,582], jellyfish:[445,700], octopus:[687,700],
  penguin:[427,700], shark:[700,393], squid:[700,479], turtle:[700,479], whale:[700,452] };
const article = n => /^[aeiou]/.test(n) ? 'an' : 'a';

const W = 1366, H = 598, SURFACE = 150, FLOOR = 560;
const $ = id => document.getElementById(id);
const stage = $('stage');
stage.addEventListener('scroll', () => { stage.scrollLeft = 0; stage.scrollTop = 0; });

// preload images
NAMES.forEach(n => { const i = new Image(); i.src = `animals/${n}.webp`; });

// ---------- scaling ----------
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

// ---------- scenery ----------
(function scenery() {
  let d = 'M0 30 L0 14';
  for (let x = 0; x <= 2732; x += 683 / 12) d += ` Q${x + 683 / 48} 4 ${x + 683 / 24} 14 T${x + 683 / 12} 14`;
  d += ' L2732 30 Z';
  $('wavePath').setAttribute('d', d);
  const decor = $('decor');
  const weeds = [[40, '#3cb371', 120], [110, '#f2c94c', 90], [330, '#2e8b57', 140], [610, '#3cb371', 100],
                 [880, '#f2c94c', 130], [1010, '#2e8b57', 90], [1250, '#3cb371', 150], [1310, '#f2c94c', 100]];
  weeds.forEach(([x, c, h], i) => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 40 100'); s.setAttribute('class', 'weed');
    s.style.left = x + 'px'; s.style.width = '40px'; s.style.height = h + 'px'; s.style.animationDelay = (-i * .7) + 's';
    s.innerHTML = `<path d="M20 100 Q8 80 20 60 Q32 40 20 20 Q12 8 20 0" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/>
      <ellipse cx="11" cy="70" rx="8" ry="4" fill="${c}"/><ellipse cx="29" cy="48" rx="8" ry="4" fill="${c}"/><ellipse cx="12" cy="26" rx="7" ry="3.5" fill="${c}"/>`;
    decor.appendChild(s);
  });
  // rocks
  [[200, 60], [760, 80], [1120, 55]].forEach(([x, w]) => {
    const r = document.createElement('div');
    Object.assign(r.style, { position: 'absolute', left: x + 'px', bottom: '22px', width: w + 'px', height: w * .55 + 'px',
      background: '#8a9aa8', borderRadius: '50% 50% 10px 10px', zIndex: 2, boxShadow: 'inset -8px -6px 0 rgba(0,0,0,.15)' });
    decor.appendChild(r);
  });
})();

const bubbles = [];
function spawnBubble(x, y) {
  const b = document.createElement('div'); b.className = 'bubble';
  const r = 6 + Math.random() * 10; b.style.width = b.style.height = r + 'px';
  stage.appendChild(b);
  bubbles.push({ el: b, x: x ?? Math.random() * W, y: y ?? FLOOR, r, ph: Math.random() * 6 });
}

// ---------- sound ----------
let soundOn = true, actx = null;
function ac() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function tone(freq, dur, type = 'sine', vol = .2, slideTo = null, delay = 0) {
  if (!soundOn) return;
  try {
    const a = ac(), t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  plop: () => { tone(600, .15, 'sine', .25, 150); },
  bite: () => { tone(300, .08, 'square', .12); tone(500, .1, 'square', .12, null, .09); tone(800, .15, 'square', .12, null, .19); },
  splash: () => { tone(900, .3, 'triangle', .2, 120); tone(400, .25, 'sine', .15, 90, .05); },
  reveal: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .18, null, i * .08)); },
  correct: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .3, 'sine', .2, null, i * .1)); },
  wrong: () => { tone(220, .25, 'sawtooth', .12); tone(180, .35, 'sawtooth', .12, null, .2); },
  tick: () => tone(1200, .06, 'square', .08),
  nothing: () => { tone(400, .2, 'triangle', .15, 250); tone(250, .3, 'triangle', .15, 180, .2); },
  fanfare: () => { [523, 523, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, i === 6 ? .6 : .18, 'square', .1, null, [0,.15,.3,.45,.7,.9,1.05][i])); },
};
function say(text) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = .85;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
$('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '🔊' : '🔇'; };

// ---------- animals in the water ----------
let sea = [];
function makeAnimal(name, opts = {}) {
  const info = ANIMALS[name], [iw, ih] = SIZES[name];
  const w = info.w, h = w * ih / iw;
  const el = document.createElement('div'); el.className = 'animal';
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.innerHTML = `<img src="animals/${name}.webp" alt="">`;
  stage.appendChild(el);
  const dir = Math.random() < .5 ? 1 : -1;
  const a = { name, info, el, w, h, dir, ph: Math.random() * 6.28, state: 'swim', t: 0 };
  if (info.kind === 'walk') {
    a.speed = 30 + Math.random() * 20; a.baseY = FLOOR - h / 2 + 8;
  } else if (info.kind === 'float') {
    a.speed = 18 + Math.random() * 14; a.baseY = 230 + Math.random() * 230;
  } else {
    a.speed = info.speed * (.8 + Math.random() * .4);
    a.baseY = Math.max(SURFACE + 40 + h / 2, Math.min(FLOOR - 30 - h / 2, 200 + Math.random() * 300));
  }
  a.x = opts.x ?? (dir === 1 ? -w / 2 - Math.random() * 200 : W + w / 2 + Math.random() * 200);
  a.y = opts.y ?? a.baseY;
  sea.push(a);
  return a;
}
function resetSea() {
  sea.forEach(a => a.el.remove()); sea = [];
  // one of each, plus a couple of extra fish, spread across the screen
  const list = [...NAMES, 'fish', 'jellyfish'];
  list.forEach(n => { const a = makeAnimal(n); a.x = 80 + Math.random() * (W - 160); a.y = a.baseY; });
}
function respawnLater(name, ms = 1500) { setTimeout(() => { if (playing) makeAnimal(name); }, ms); }

function updateAnimal(a, dt) {
  a.t += dt; a.ph += dt;
  if (a.state === 'swim') {
    a.x += a.dir * a.speed * dt;
    if (a.info.kind === 'float') a.y = a.baseY + Math.sin(a.ph * 1.3) * 28;
    else if (a.info.kind === 'walk') a.y = a.baseY + Math.abs(Math.sin(a.ph * 6)) * -3;
    else a.y = a.baseY + Math.sin(a.ph * 1.8) * 10;
    // wrap around off-screen: come back from the other side at a new depth
    if ((a.dir === 1 && a.x > W + a.w) || (a.dir === -1 && a.x < -a.w)) {
      if (Math.random() < .5) a.dir *= -1; else a.x = a.dir === 1 ? -a.w / 2 : W + a.w / 2;
      if (a.info.kind === 'swim') a.baseY = Math.max(SURFACE + 40 + a.h / 2, Math.min(FLOOR - 30 - a.h / 2, 200 + Math.random() * 300));
      if (a.info.kind === 'float') a.baseY = 230 + Math.random() * 230;
    }
  } else if (a.state === 'dive') { // released back into the water
    a.y += (a.baseY - a.y) * Math.min(1, dt * 2.2);
    a.x += a.dir * a.speed * .5 * dt;
    if (Math.abs(a.y - a.baseY) < 3) a.state = 'swim';
  }
  draw(a);
}
function draw(a, extra = '') {
  const flip = a.info.facing === 0 ? 1 : (a.dir === a.info.facing ? 1 : -1);
  let rot = 0;
  if (a.state === 'swim' && a.info.kind === 'swim') rot = Math.cos(a.ph * 1.8) * 4 * a.dir;
  a.el.style.transform = `translate(${a.x - a.w / 2}px, ${a.y - a.h / 2}px) rotate(${rot}deg) scaleX(${flip}) ${extra}`;
}

// ---------- boat & hook ----------
const boat = { x: W / 2, dir: 1, speed: 55, bob: 0 };
const hook = { state: 'idle', y: 0, caught: null };
const ROD_DX = 86, ROD_TOP = 54; // rod tip relative to boat center
let playing = false;

function rodTip() { return { x: boat.x + ROD_DX, y: ROD_TOP + Math.sin(boat.bob) * 3 }; }

function updateBoat(dt) {
  boat.bob += dt * 2;
  if (hook.state === 'idle' && playing) {
    boat.x += boat.dir * boat.speed * dt;
    if (boat.x > W - 220) boat.dir = -1;
    if (boat.x < 150) boat.dir = 1;
  }
  const b = $('boat');
  b.style.transform = `translate(${boat.x - 100}px, ${Math.sin(boat.bob) * 3}px) rotate(${Math.sin(boat.bob * .8) * 2}deg)`;
}

function dropHook() {
  if (!playing || hook.state !== 'idle') return;
  hook.state = 'down'; hook.y = rodTip().y + 30; hook.caught = null; hook.wait = 0;
  $('dropBtn').disabled = true;
  sfx.plop();
}

function updateHook(dt) {
  const tip = rodTip(), hx = tip.x;
  const restY = tip.y + 60;
  if (hook.state === 'idle') hook.y = restY;
  else if (hook.state === 'down') {
    hook.y += (hook.y < SURFACE ? 260 : 170) * dt;
    if (hook.y > SURFACE && hook.y - 170 * dt <= SURFACE) { sfx.plop(); for (let i = 0; i < 4; i++) spawnBubble(hx + Math.random() * 20 - 10, SURFACE + 10); }
    if (Math.random() < dt * 3) spawnBubble(hx, hook.y);
    // anything touching the hook?
    const hit = sea.find(a => (a.state === 'swim' || a.state === 'dive') &&
      Math.abs(hx - a.x) < a.w * .45 + 12 && Math.abs(hook.y + 22 - a.y) < a.h * .42 + 8);
    if (hit) {
      hook.caught = hit; hit.state = 'hooked'; hit.el.classList.add('hooked');
      hook.state = 'up'; sfx.bite();
    } else if (hook.y > FLOOR - 30) {
      hook.y = FLOOR - 30; hook.wait = (hook.wait || 0) + dt; // wait on the sea floor for a moment
      if (hook.wait > 2.5) { hook.wait = 0; hook.state = 'upEmpty'; sfx.nothing(); toast('Oh no! Nothing… 🫧'); }
    }
  } else if (hook.state === 'up' || hook.state === 'upEmpty') {
    hook.y -= 300 * dt;
    if (Math.random() < dt * 8) tone(900 + Math.random() * 300, .03, 'square', .04);
    if (hook.caught) {
      const a = hook.caught;
      a.x = hx + Math.sin(a.t * 18) * 6; a.y = hook.y + 22 + a.h * .35; a.t += dt;
      draw(a, `rotate(${Math.sin(a.t * 14) * 12}deg)`);
    }
    if (hook.y <= restY) {
      hook.y = restY;
      if (hook.caught) { hook.state = 'landed'; showCatch(hook.caught); }
      else { hook.state = 'idle'; $('dropBtn').disabled = false; }
    }
  }
  $('lineEl').setAttribute('x1', tip.x); $('lineEl').setAttribute('y1', tip.y);
  $('lineEl').setAttribute('x2', hx); $('lineEl').setAttribute('y2', hook.y + 2);
  $('hook').style.transform = `translate(${hx - 11}px, ${hook.y}px)`;
}

// ---------- catch flow ----------
let current = null;
function showCatch(a) {
  current = a;
  a.el.style.visibility = 'hidden';
  $('bigAnimal').src = `animals/${a.name}.webp`;
  $('mystery').classList.remove('open');
  $('answerWord').textContent = a.name;
  $('answerJa').textContent = ANIMALS[a.name].ja;
  $('revealBtn').classList.remove('hidden');
  $('correctBtn').classList.add('hidden'); $('wrongBtn').classList.add('hidden');
  $('catchOverlay').classList.add('show');
  $('catchCard').style.animation = 'none'; void $('catchCard').offsetWidth; $('catchCard').style.animation = '';
  sfx.splash();
}
function reveal() {
  if (!current || $('mystery').classList.contains('open')) return;
  $('mystery').classList.add('open');
  $('revealBtn').classList.add('hidden');
  $('correctBtn').classList.remove('hidden'); $('wrongBtn').classList.remove('hidden');
  sfx.reveal();
  setTimeout(() => say(`It's ${article(current.name)} ${current.name}!`), 350);
}
$('mystery').onclick = reveal; $('revealBtn').onclick = reveal;

const bucket = {};
function bucketTotal() { return Object.values(bucket).reduce((s, n) => s + n, 0); }
function judge(correct) {
  if (!current || !$('mystery').classList.contains('open')) return;
  const a = current; current = null;
  $('catchOverlay').classList.remove('show');
  a.el.style.visibility = '';
  a.el.classList.remove('hooked');
  if (correct) {
    sfx.correct();
    flyToBucket(a);
    bucket[a.name] = (bucket[a.name] || 0) + 1;
    sea = sea.filter(s => s !== a);
    respawnLater(a.name);
  } else {
    sfx.wrong();
    toast('Back into the sea! 🌊');
    // throw it back in
    a.state = 'dive'; a.y = SURFACE + 10; a.dir = Math.random() < .5 ? 1 : -1;
    if (a.info.kind === 'walk') a.baseY = FLOOR - a.h / 2 + 8;
    setTimeout(sfx.splash, 150);
    for (let i = 0; i < 6; i++) spawnBubble(a.x + Math.random() * 40 - 20, SURFACE + 20);
  }
  hook.caught = null; hook.state = 'idle'; $('dropBtn').disabled = false;
}
$('correctBtn').onclick = () => judge(true);
$('wrongBtn').onclick = () => judge(false);

function flyToBucket(a) {
  const el = a.el, sx = a.x - a.w / 2, sy = a.y - a.h / 2;
  const tx = 175 - a.w / 2, ty = 35 - a.h / 2;
  let t = 0;
  el.style.zIndex = 25;
  const step = () => {
    t += 1 / 40;
    const e = t * t * (3 - 2 * t);
    const x = sx + (tx - sx) * e, y = sy + (ty - sy) * e - Math.sin(e * Math.PI) * 150;
    el.style.transform = `translate(${x}px, ${y}px) scale(${1 - e * .85}) rotate(${e * 360}deg)`;
    if (t < 1) requestAnimationFrame(step);
    else {
      el.remove();
      $('bucketCount').textContent = bucketTotal();
      $('bucketBox').classList.remove('bump'); void $('bucketBox').offsetWidth; $('bucketBox').classList.add('bump');
    }
  };
  step();
}

let toastTimer;
function toast(msg) {
  $('toast').textContent = msg; $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1600);
}

// ---------- end of game ----------
let endTimers = [];
function finish() {
  if (!playing) return;
  if (current) return; // finish marking first
  playing = false;
  const grid = $('endGrid'); grid.innerHTML = '';
  $('endTotal').textContent = '';
  const caught = NAMES.filter(n => bucket[n]).sort((x, y) => bucket[y] - bucket[x]);
  const order = caught.length ? caught : [];
  if (!order.length) {
    grid.innerHTML = '<div style="font-size:36px;color:#6b7a89">Your bucket is empty! 🪣<br>Let\'s go fishing!</div>';
  }
  order.forEach(n => {
    const d = document.createElement('div'); d.className = 'tally';
    d.innerHTML = `<img src="animals/${n}.webp" alt=""><div class="tname">${n}</div><div class="tnum">× 0</div>`;
    grid.appendChild(d);
  });
  $('endOverlay').classList.add('show');
  endTimers.forEach(clearTimeout); endTimers = [];
  // count up animal by animal
  let running = 0, delay = 500;
  [...grid.children].forEach((d, i) => {
    const n = order[i]; if (!n) return;
    endTimers.push(setTimeout(() => { d.classList.add('show'); sfx.plop(); }, delay));
    delay += 300;
    for (let k = 1; k <= bucket[n]; k++) {
      endTimers.push(setTimeout(() => {
        d.querySelector('.tnum').textContent = '× ' + k; running++;
        $('endTotal').textContent = running; sfx.tick();
      }, delay));
      delay += 180;
    }
    delay += 150;
  });
  endTimers.push(setTimeout(() => {
    const total = bucketTotal();
    if (total) {
      $('endTotal').textContent = `You caught ${total} sea animal${total === 1 ? '' : 's'}! 🎉`;
      sfx.fanfare(); confetti();
      setTimeout(() => say(`You caught ${total} sea animal${total === 1 ? '' : 's'}! Great job!`), 600);
    }
  }, delay + 200));
}
function confetti() {
  const cols = ['#ff8a1f', '#2f86de', '#2fb84f', '#e5484d', '#ffcc33', '#8a5cf5'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.background = cols[i % cols.length]; c.style.left = Math.random() * W + 'px'; c.style.top = '-20px';
    stage.appendChild(c);
    const vy = 150 + Math.random() * 250, vx = (Math.random() - .5) * 120, spin = Math.random() * 720;
    let t = 0;
    const f = () => { t += 1 / 60; c.style.transform = `translate(${vx * t}px, ${vy * t}px) rotate(${spin * t}deg)`;
      if (t < 4) requestAnimationFrame(f); else c.remove(); };
    setTimeout(f, Math.random() * 600);
  }
}
$('finishBtn').onclick = finish;
$('backBtn').onclick = () => { endTimers.forEach(clearTimeout); $('endOverlay').classList.remove('show'); playing = true; };
$('againBtn').onclick = () => { endTimers.forEach(clearTimeout); $('endOverlay').classList.remove('show'); newGame(); };

function newGame() {
  NAMES.forEach(n => delete bucket[n]);
  $('bucketCount').textContent = 0;
  hook.state = 'idle'; hook.caught = null; current = null;
  $('dropBtn').disabled = false;
  resetSea();
  playing = true;
}
$('startBtn').onclick = () => { ac(); $('startOverlay').classList.remove('show'); newGame(); };
$('dropBtn').onclick = dropHook;

addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if ($('startOverlay').classList.contains('show')) { if (k === ' ' || k === 'enter') { e.preventDefault(); $('startBtn').click(); } return; }
  if (k === ' ') { e.preventDefault(); if (current) reveal(); else dropHook(); }
  else if (k === 'enter') { e.preventDefault(); reveal(); }
  else if (k === 'c' || k === 'o') judge(true);
  else if (k === 'x') judge(false);
});

// ---------- main loop ----------
resetSea(); // animals swim behind the start screen
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  updateBoat(dt);
  sea.forEach(a => { if (a.state !== 'hooked') updateAnimal(a, dt); });
  updateHook(dt);
  if (Math.random() < dt * 1.2) spawnBubble();
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.y -= (40 + b.r * 3) * dt; b.ph += dt * 3;
    b.el.style.transform = `translate(${b.x + Math.sin(b.ph) * 5}px, ${b.y}px)`;
    if (b.y < SURFACE + 5) { b.el.remove(); bubbles.splice(i, 1); }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
